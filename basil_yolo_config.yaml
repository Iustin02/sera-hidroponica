# YOLOv8 Training Configuration for Basil Disease Detection

# Data
data: basil_dataset/data.yaml

# Model
model: yolov8n.pt  # nano, small, medium, large, xlarge
imgsz: 640
epochs: 50
batch: 16
device: 0

# Training options
patience: 10
save: true
verbose: true

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10
translate: 0.1
scale: 0.5
flipud: 0.5
fliplr: 0.5
